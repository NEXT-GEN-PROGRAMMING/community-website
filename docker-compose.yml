services:
  client:
    image: node:26-alpine
    container_name: nextgen-client
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:8000
      - CI=true
    command: sh -c "npm install -g pnpm && pnpm install && pnpm dev --host"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 90s
    depends_on:
      - server

  server:
    image: node:26-alpine
    container_name: nextgen-server
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://nextgen:nextgen_secret@postgres:5432/nextgen_db?schema=public
      - REDIS_URL=redis://redis:6379
      - CI=true
    command: sh -c "npm install -g pnpm && pnpm install && pnpm prisma db push && pnpm dev"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: nextgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextgen
      POSTGRES_PASSWORD: nextgen_secret
      POSTGRES_DB: nextgen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextgen -d nextgen_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0-alpine
    container_name: nextgen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  client_node_modules:
  server_node_modules: