# ============================================
# Validates that all Docker images build successfully
# and docker-compose stack can start up.
# ============================================

name: Docker

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-up:
    name: "Docker → Compose Up"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create .env file
        run: |
          cp .env.example .env

      - name: Build and start all services
        run: |
          docker compose up -d --build --wait --wait-timeout 300

      - name: Verify all containers are healthy
        run: |
          # docker compose up --wait already blocked until every service's
          # healthcheck passed (client/server/postgres/redis all define one),
          # so this is just a final confirmation + status printout.
          echo "=== Container Status ==="
          docker compose ps

          for service in client server postgres redis; do
            health=$(docker compose ps --format json $service | jq -r '.[0].Health // .Health // "none"' 2>/dev/null || echo "none")
            if [[ "$health" != "healthy" ]]; then
              echo "[!!!] Service '$service' is not healthy (status: $health)"
              docker compose logs $service --tail=50
              exit 1
            fi
            echo "[OK] $service is healthy"
          done

          echo "[OK] Server reachable at http://localhost:8000, client at http://localhost:3000"

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans